services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: migration
      POSTGRES_USER: migration
      POSTGRES_PASSWORD: local-only-migration
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migration -d migration"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - migration-postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: localmigration
      MINIO_ROOT_PASSWORD: local-only-migration-storage
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - migration-minio:/data

volumes:
  migration-postgres:
  migration-minio:

