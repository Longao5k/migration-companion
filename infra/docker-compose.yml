services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: migration
      POSTGRES_USER: migration
      POSTGRES_PASSWORD: local-only-migration
    ports:
      - "127.0.0.1:${LOCAL_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migration -d migration"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - migration-postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: localmigration
      MINIO_ROOT_PASSWORD: local-only-migration-storage
    ports:
      # Windows/Hyper-V frequently reserves random high-port blocks around
      # 59000. Keep these configurable and default outside that common range.
      - "127.0.0.1:${LOCAL_MINIO_PORT:-45900}:9000"
      - "127.0.0.1:${LOCAL_MINIO_CONSOLE_PORT:-45901}:9001"
    volumes:
      - migration-minio:/data

volumes:
  migration-postgres:
  migration-minio:
