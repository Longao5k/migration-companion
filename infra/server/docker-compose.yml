name: migration-companion

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: migration
      POSTGRES_USER: migration
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migration -d migration"]
      interval: 5s
      timeout: 4s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: ${PUBLIC_WEB_URL}
      MINIO_API_CORS_ALLOW_ORIGIN: ${PUBLIC_WEB_URL}
    ports:
      - "127.0.0.1:${MINIO_PORT:-59100}:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 4s
      retries: 20
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_USER_BUCKET: ${S3_USER_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${S3_USER_BUCKET}" &&
        mc anonymous set none "local/$${S3_USER_BUCKET}"
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infra/server/Dockerfile.api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://migration:${POSTGRES_PASSWORD}@postgres:5432/migration?schema=public
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${PUBLIC_FILES_URL}
      S3_FORCE_PATH_STYLE: "true"
      CONTENT_SOURCE_REGISTRY: /app/config/sources.json
      DEV_AUTH: "false"
      DEV_STORE: "false"
      DEV_AUTO_SCAN: "false"
    command: ["sh", "-c", "./node_modules/.bin/prisma migrate deploy && node scripts/seed-content.mjs && node dist/main.js"]
    ports:
      - "127.0.0.1:${API_PORT:-53101}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ../..
      dockerfile: infra/server/Dockerfile.web
      args:
        # 网页与 API 现在是两个域名，分享页和邀请页都在浏览器里直接调 API，
        # 因此这里必须是 API 域名，不能沿用网页域名。
        NEXT_PUBLIC_API_BASE: ${PUBLIC_API_URL}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:${WEB_PORT:-53103}:3000"
    depends_on:
      api:
        condition: service_healthy

  admin:
    build:
      context: ../..
      dockerfile: infra/server/Dockerfile.admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMIN_PORT:-53102}:80"
    depends_on:
      api:
        condition: service_healthy

  crawler:
    build:
      context: ../..
      dockerfile: infra/server/Dockerfile.crawler
    restart: unless-stopped
    env_file: .env
    environment:
      REVIEW_API_URL: http://api:3000
      CRAWLER_STATE_DIR: /data/evidence
    volumes:
      - crawler-evidence:/data/evidence
    depends_on:
      api:
        condition: service_healthy
      crawler-init:
        condition: service_completed_successfully

  crawler-init:
    image: migration-companion-crawler
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /data/evidence"]
    volumes:
      - crawler-evidence:/data/evidence
    restart: "no"

  maintenance:
    image: curlimages/curl:8.16.0
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./maintenance.sh:/maintenance.sh:ro
    entrypoint: ["/bin/sh", "/maintenance.sh"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
  crawler-evidence:
