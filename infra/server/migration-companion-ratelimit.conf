# Migration Companion 的 nginx 速率限制区（放在 http 块，需 include 到 nginx.conf）。
#
# 服务端已按邮箱做失败锁定（5 次错误锁 15 分钟），但那挡不住换邮箱轮询、也挡不住
# 单个来源对整个 API 的洪泛。这里按来源 IP 再加一层。
#
# 只用 10m 共享内存，约可跟踪 16 万个来源 IP，对这台 2 GB 的机器没有压力。

# 登录类接口：真人登录一次就够，1 r/s 已经很宽松。
limit_req_zone $binary_remote_addr zone=mc_login:10m rate=1r/s;

# 无账号的分享访问码交换：收件人输错几次是正常的，但不能被用来暴力猜访问码。
limit_req_zone $binary_remote_addr zone=mc_share:10m rate=2r/s;

# API 其余部分：App 同步时会有突发，速率放宽，主要靠 burst 吸收。
limit_req_zone $binary_remote_addr zone=mc_api:10m rate=20r/s;

# 单 IP 并发连接数上限，防止慢速连接占满 worker。
limit_conn_zone $binary_remote_addr zone=mc_conn:10m;

# 被限流时返回 429 而不是默认的 503——429 语义正确，客户端也能据此退避。
limit_req_status 429;
limit_conn_status 429;
