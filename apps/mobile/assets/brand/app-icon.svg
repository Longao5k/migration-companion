<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">WAYmark signal and document icon</title>
  <desc id="desc">A clean blue app icon combining an information signal with a verified document checklist.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D4DA7"/>
      <stop offset="1" stop-color="#062E70"/>
    </linearGradient>
    <filter id="paper-shadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#001D54" flood-opacity=".30"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="220" fill="url(#blue)"/>

  <!-- Information signal: deliberately open toward the document. -->
  <path d="M385 664A224 224 0 1 1 609 440" fill="none" stroke="#FFFFFF" stroke-width="58" stroke-linecap="round"/>
  <path d="M385 548A108 108 0 1 1 493 440" fill="none" stroke="#FFFFFF" stroke-width="58" stroke-linecap="round"/>
  <circle cx="385" cy="440" r="30" fill="#FFFFFF"/>

  <!-- Personal checklist document. -->
  <path d="M530 448h188l82 82v238c0 27-22 49-49 49H530c-27 0-49-22-49-49V497c0-27 22-49 49-49z" fill="#FFFFFF" filter="url(#paper-shadow)"/>
  <path d="M718 448v82h82" fill="#BCD8F7"/>

  <!-- Neutral source/international information cue, without an official emblem. -->
  <circle cx="640" cy="575" r="51" fill="none" stroke="#1553B1" stroke-width="10"/>
  <path d="M589 575h102M640 524c-17 14-27 31-27 51s10 37 27 51M640 524c17 14 27 31 27 51s-10 37-27 51M640 524v102" fill="none" stroke="#1553B1" stroke-width="8" stroke-linecap="round"/>

  <!-- Three clear material states. -->
  <g fill="#1553B1">
    <circle cx="574" cy="672" r="23"/>
    <circle cx="574" cy="733" r="23"/>
    <circle cx="574" cy="794" r="23"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="m562 672 9 9 18-21"/>
    <path d="m562 733 9 9 18-21"/>
    <path d="m562 794 9 9 18-21"/>
  </g>
  <g stroke="#1553B1" stroke-width="13" stroke-linecap="round">
    <path d="M630 672h106"/>
    <path d="M630 733h106"/>
    <path d="M630 794h106"/>
  </g>
</svg>
