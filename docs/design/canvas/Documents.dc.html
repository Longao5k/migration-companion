<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
    a { color: #147B66; } a:hover { color: #0F5E4E; }
    .serif { font-family: "Noto Serif SC", "Songti SC", "SimSun", serif; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F7F8F5; color: #142231; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 4px;">
    <div class="serif" style="font-size: 26px; font-weight: 900; letter-spacing: -0.5px;">我的文档</div>
    <div style="display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #5B6660;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5B6660" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 018 0v3"></path></svg>
      <span>只存在这台手机上</span>
    </div>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 0 20px; overflow: hidden;">

    <div style="background: #FFFFFF; border: 1px solid #E2E6E1; border-radius: 18px; padding: 14px; display: flex; align-items: center; gap: 13px;">
      <div style="width: 42px; height: 42px; border-radius: 11px; background: #FBEBEA; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#A2544F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h7l5 5v13H6z"></path><path d="M13 3v5h5"></path></svg>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 3px;">
        <span style="font-size: 14.5px; font-weight: 600;">护照身份页.pdf</span>
        <span style="font-size: 11.5px; color: #7A837D;">1.2 MB · 8月20日</span>
      </div>
      <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-right: -8px;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#7A837D" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="6" r="0.6"></circle><circle cx="12" cy="12" r="0.6"></circle><circle cx="12" cy="18" r="0.6"></circle></svg>
      </div>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E2E6E1; border-radius: 18px; padding: 14px; display: flex; align-items: center; gap: 13px;">
      <div style="width: 42px; height: 42px; border-radius: 11px; background: #E9F0FB; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#3A5C87" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h7l5 5v13H6z"></path><path d="M13 3v5h5"></path></svg>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 3px;">
        <span style="font-size: 14.5px; font-weight: 600;">工作证明.docx</span>
        <span style="font-size: 11.5px; color: #7A837D;">340 KB · 8月18日</span>
      </div>
      <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-right: -8px;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#7A837D" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="6" r="0.6"></circle><circle cx="12" cy="12" r="0.6"></circle><circle cx="12" cy="18" r="0.6"></circle></svg>
      </div>
    </div>

    <div style="background: #FFFFFF; border: 1px dashed #CDD4CE; border-radius: 18px; padding: 22px 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 4px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9AA39C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V6"></path><path d="M8 10l4-4 4 4"></path><path d="M5 18h14"></path></svg>
      <span style="font-size: 13.5px; font-weight: 600; color: #46504A;">添加文件</span>
      <span style="font-size: 11.5px; color: #8A928C; text-align: center;">从相册、文件或直接拍照</span>
    </div>

    <div style="margin-top: 6px; background: #FFF8E9; border: 1px solid #F0E2C2; border-radius: 16px; padding: 14px; display: flex; gap: 11px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B07C14" stroke-width="1.9" stroke-linecap="round" style="flex-shrink: 0; margin-top: 1px;"><path d="M12 9v4.5"></path><path d="M12 17v.1"></path><path d="M10.3 4.2L2.9 17a2 2 0 001.7 3h14.8a2 2 0 001.7-3L13.7 4.2a2 2 0 00-3.4 0z"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <span style="font-size: 13px; font-weight: 600; color: #6B5416;">记得备份</span>
        <span style="font-size: 12px; line-height: 1.55; color: #8A6C21; text-wrap: pretty;">文件只在这台手机上。换手机或卸载 App 之前，先导出一份备份。</span>
      </div>
    </div>

  </div>

  <div style="height: 72px; background: #FFFFFF; border-top: 1px solid #E2E6E1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6660" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4z"></path><path d="M8 9h8M8 13h8M8 17h5"></path></svg>
      <span style="font-size: 11px; font-weight: 500; color: #5B6660;">资讯</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6660" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3"></circle></svg>
      <span style="font-size: 11px; font-weight: 500; color: #5B6660;">追踪</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6660" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h9a2 2 0 012 2v12a2 2 0 01-2 2H6a2 2 0 01-2-2V8"></path><path d="M4 8h5V3"></path><path d="M9 13l2 2 4-4"></path></svg>
      <span style="font-size: 11px; font-weight: 500; color: #5B6660;">申请</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <div style="width: 52px; height: 30px; border-radius: 15px; background: rgba(162,242,220,0.72); display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0A3F34" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h7l5 5v13H6z"></path><path d="M13 3v5h5"></path></svg>
      </div>
      <span style="font-size: 11px; font-weight: 700; color: #142231;">文档</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6660" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"></path></svg>
      <span style="font-size: 11px; font-weight: 500; color: #5B6660;">我的</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
