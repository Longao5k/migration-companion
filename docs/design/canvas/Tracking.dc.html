<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
    a { color: #147B66; } a:hover { color: #0F5E4E; }
    .serif { font-family: "Noto Serif SC", "Songti SC", "SimSun", serif; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F7F8F5; color: #142231; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 20px 20px 14px; display: flex; flex-direction: column; gap: 4px;">
    <div class="serif" style="font-size: 26px; font-weight: 900; letter-spacing: -0.5px;">官方页面变化</div>
    <div style="font-size: 12.5px; color: #5B6660;">我们每天核对南澳与联邦的官方页面，有改动就记在这里。</div>
  </div>

  <div style="display: flex; gap: 8px; padding: 0 20px 16px;">
    <span style="font-size: 12px; font-weight: 600; color: #FFFFFF; background: #147B66; border-radius: 10px; padding: 7px 13px;">全部</span>
    <span style="font-size: 12px; color: #46504A; background: #FFFFFF; border: 1px solid #E2E6E1; border-radius: 10px; padding: 7px 13px;">已核实</span>
    <span style="font-size: 12px; color: #46504A; background: #FFFFFF; border: 1px solid #E2E6E1; border-radius: 10px; padding: 7px 13px;">我关注的</span>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 0 20px; overflow: hidden;">

    <div style="background: #FFFFFF; border: 1px solid #E2E6E1; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 11px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: #0A3F34; background: #C9F0E2; border-radius: 999px; padding: 5px 10px;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0A3F34" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
          已核实
        </span>
        <span style="font-size: 11px; color: #7A837D;">8月26日</span>
      </div>
      <div class="serif" style="font-size: 17.5px; line-height: 1.35; font-weight: 700; text-wrap: pretty;">
        职业清单页面新增 3 个职业
      </div>
      <div style="display: flex; flex-direction: column; gap: 7px;">
        <div style="display: flex; gap: 9px; align-items: flex-start;">
          <span style="font-size: 11px; color: #A2544F; background: #FBEBEA; border-radius: 6px; padding: 2px 7px; flex-shrink: 0;">改前</span>
          <span style="font-size: 13px; line-height: 1.5; color: #7A837D; text-decoration: line-through;">共 428 个职业</span>
        </div>
        <div style="display: flex; gap: 9px; align-items: flex-start;">
          <span style="font-size: 11px; color: #0A3F34; background: #DFF3EA; border-radius: 6px; padding: 2px 7px; flex-shrink: 0;">改后</span>
          <span style="font-size: 13px; line-height: 1.5; color: #26302B;">共 431 个职业</span>
        </div>
      </div>
      <div style="height: 1px; background: #EDEFEC;"></div>
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: 11.5px; color: #7A837D;">南澳州政府 · 职业清单</span>
        <span style="font-size: 12.5px; font-weight: 600; color: #147B66;">对比原文</span>
      </div>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E2E6E1; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 11px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: #6B5416; background: #F7E9C8; border-radius: 999px; padding: 5px 10px;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6B5416" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 8v5"></path><path d="M12 16.2v.1"></path></svg>
          待核实
        </span>
        <span style="font-size: 11px; color: #7A837D;">8月25日</span>
      </div>
      <div class="serif" style="font-size: 17.5px; line-height: 1.35; font-weight: 700; text-wrap: pretty;">
        审理时间页面有改动
      </div>
      <div style="font-size: 13px; line-height: 1.6; color: #5B6660; text-wrap: pretty;">
        系统发现这个页面变了，我们的编辑还在核对。核对完会补上说明。
      </div>
      <div style="height: 1px; background: #EDEFEC;"></div>
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: 11.5px; color: #7A837D;">南澳州政府 · 审理时间</span>
        <span style="font-size: 12.5px; font-weight: 600; color: #147B66;">对比原文</span>
      </div>
    </div>

  </div>

  <div style="height: 72px; background: #FFFFFF; border-top: 1px solid #E2E6E1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6660" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4z"></path><path d="M8 9h8M8 13h8M8 17h5"></path></svg>
      <span style="font-size: 11px; font-weight: 500; color: #5B6660;">资讯</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <div style="width: 52px; height: 30px; border-radius: 15px; background: rgba(162,242,220,0.72); display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0A3F34" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3"></circle></svg>
      </div>
      <span style="font-size: 11px; font-weight: 700; color: #142231;">追踪</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6660" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h9a2 2 0 012 2v12a2 2 0 01-2 2H6a2 2 0 01-2-2V8"></path><path d="M4 8h5V3"></path><path d="M9 13l2 2 4-4"></path></svg>
      <span style="font-size: 11px; font-weight: 500; color: #5B6660;">申请</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6660" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h7l5 5v13H6z"></path><path d="M13 3v5h5"></path></svg>
      <span style="font-size: 11px; font-weight: 500; color: #5B6660;">文档</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6660" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"></path></svg>
      <span style="font-size: 11px; font-weight: 500; color: #5B6660;">我的</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
