<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WAYmark logo explorations</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f6f3ec; color: #17332e; }
    body { margin: 0; padding: 48px; }
    main { max-width: 960px; margin: 0 auto; }
    h1 { margin: 0 0 10px; font-size: 30px; letter-spacing: -.04em; }
    p { color: #61706b; margin: 0 0 32px; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; }
    figure { margin: 0; }
    img { display: block; width: 100%; border-radius: 28px; box-shadow: 0 18px 40px rgba(20, 34, 49, .13); }
    figcaption { padding: 14px 4px 0; font-weight: 700; }
    small { display: block; margin-top: 5px; color: #6d7974; font-weight: 500; line-height: 1.35; }
    @media (max-width: 760px) { body { padding: 24px; } .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  </style>
</head>
<body>
  <main>
    <h1>WAYmark</h1>
    <p>Four new directions without the previous route-and-nodes visual language.</p>
    <section class="grid">
      <figure><img src="01-w-monogram.svg" alt="W monogram"><figcaption>W Monogram<small>品牌字母、强识别度</small></figcaption></figure>
      <figure><img src="02-frame-mark.svg" alt="Frame mark"><figcaption>Frame<small>清晰边界、进入新阶段</small></figcaption></figure>
      <figure><img src="03-fold-mark.svg" alt="Fold mark"><figcaption>Fold<small>材料工作空间、记录与核对</small></figcaption></figure>
      <figure><img src="04-signal-mark.svg" alt="Signal mark"><figcaption>Signal<small>更新、提醒、可靠信息</small></figcaption></figure>
    </section>
  </main>
</body>
</html>
