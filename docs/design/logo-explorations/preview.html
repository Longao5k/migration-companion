<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Migration Companion Logo Explorations</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f6f3ec; color: #17332e; }
    body { margin: 0; padding: 48px; }
    main { max-width: 960px; margin: 0 auto; }
    h1 { margin: 0 0 10px; font-size: 30px; letter-spacing: -.03em; }
    p { color: #61706b; margin: 0 0 32px; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; }
    figure { margin: 0; }
    img { display: block; width: 100%; border-radius: 28px; box-shadow: 0 18px 40px rgba(20, 34, 49, .13); }
    figcaption { padding: 14px 4px 0; font-weight: 700; }
    small { display: block; margin-top: 5px; color: #6d7974; font-weight: 500; line-height: 1.35; }
    @media (max-width: 760px) { body { padding: 24px; } .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  </style>
</head>
<body>
  <main>
    <h1>Migration Companion</h1>
    <p>Four vector directions for a local-first migration information and document workspace.</p>
    <section class="grid">
      <figure><img src="01-waypoint.svg" alt="Waypoint logo"><figcaption>Waypoint<small>路线、节点、下一步</small></figcaption></figure>
      <figure><img src="02-gateway.svg" alt="Gateway logo"><figcaption>Gateway<small>安全进入下一阶段</small></figcaption></figure>
      <figure><img src="03-record.svg" alt="Record logo"><figcaption>Record<small>材料、证据、备份</small></figcaption></figure>
      <figure><img src="04-compass.svg" alt="Compass Bridge logo"><figcaption>Compass Bridge<small>方向感与跨境连接</small></figcaption></figure>
    </section>
  </main>
</body>
</html>
