<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WAYmark function-led logo explorations</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f6f3ec; color: #17332e; }
    body { margin: 0; padding: 48px; }
    main { max-width: 960px; margin: 0 auto; }
    h1 { margin: 0 0 10px; font-size: 30px; letter-spacing: -.04em; }
    p { color: #61706b; margin: 0 0 32px; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; }
    figure { margin: 0; }
    img { display: block; width: 100%; border-radius: 28px; box-shadow: 0 18px 40px rgba(20, 34, 49, .13); }
    figcaption { padding: 14px 4px 0; font-weight: 700; }
    small { display: block; margin-top: 5px; color: #6d7974; font-weight: 500; line-height: 1.35; }
    @media (max-width: 760px) { body { padding: 24px; } .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  </style>
</head>
<body>
  <main>
    <h1>WAYmark</h1>
    <p>Function-led symbols: workspace, evidence, privacy boundary, and five-stage progress.</p>
    <section class="grid">
      <figure><img src="01-workspace.svg" alt="Workspace symbol"><figcaption>Workspace<small>个人项目与材料空间</small></figcaption></figure>
      <figure><img src="02-evidence.svg" alt="Evidence symbol"><figcaption>Evidence<small>官方来源与核实依据</small></figcaption></figure>
      <figure><img src="03-private-core.svg" alt="Private core symbol"><figcaption>Private Core<small>本地优先与隐私边界</small></figcaption></figure>
      <figure><img src="04-five-stages.svg" alt="Five stages symbol"><figcaption>Five Stages<small>材料状态与流程进度</small></figcaption></figure>
    </section>
  </main>
</body>
</html>
