<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WAYmark signal-document iteration</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f6f3ec; color: #17332e; }
    body { margin: 0; padding: 48px; }
    main { max-width: 720px; margin: 0 auto; }
    h1 { margin: 0 0 10px; font-size: 30px; letter-spacing: -.04em; }
    p { color: #61706b; margin: 0 0 32px; line-height: 1.6; }
    .stage { display: grid; grid-template-columns: minmax(0, 1fr) 160px; gap: 28px; align-items: end; }
    img { display: block; width: 100%; border-radius: 42px; box-shadow: 0 24px 60px rgba(20, 34, 49, .18); }
    .small { width: 160px; }
    .caption { margin-top: 12px; color: #6d7974; font-size: 13px; line-height: 1.45; }
    @media (max-width: 640px) { body { padding: 24px; } .stage { grid-template-columns: 1fr; } .small { width: 112px; } }
  </style>
</head>
<body>
  <main>
    <h1>WAYmark</h1>
    <p>Single iteration based on the supplied direction: information signal + personal document checklist. Text and watermark removed; icon rebalanced for standalone use.</p>
    <div class="stage">
      <div><img src="signal-document.svg" alt="WAYmark signal and document app icon"><div class="caption">主视觉：政策/信息更新与材料清单的结合</div></div>
      <div><img class="small" src="signal-document.svg" alt="WAYmark app icon at small size"><div class="caption">64px 尺寸测试</div></div>
    </div>
  </main>
</body>
</html>
